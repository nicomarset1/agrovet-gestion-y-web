name: Restore backup test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    name: Restore latest backup into test database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
      RESTORE_TEST_DATABASE_URL: ${{ secrets.RESTORE_TEST_DATABASE_URL }}
      # Necesario solo si los backups estan cifrados (mismo secret que database-backup.yml).
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      # pg_restore --clean borra lo que hay en el destino: corta si el destino puede ser producción. El repo es
      # público, así que el log nunca muestra hosts ni URLs. La URL de producción llega solo a este paso.
      # El host directo y el del pooler de Neon (-pooler) son la misma base.
      - name: Refuse to restore over production
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node - <<'GUARD'
          function hostOf(name) {
            const value = process.env[name] ?? "";
            if (!value) throw new Error(name + " no está definida");
            let url;
            try {
              url = new URL(value);
            } catch {
              throw new Error(name + " no se puede interpretar");
            }
            const host = url.hostname.toLowerCase();
            if (!host || host.includes(",") || url.searchParams.has("host") || url.searchParams.has("hostaddr")) {
              throw new Error(name + " no tiene un host único");
            }
            return host.replace(/-pooler(?=\.)/, "");
          }
          try {
            if (hostOf("DATABASE_URL") === hostOf("RESTORE_TEST_DATABASE_URL")) {
              throw new Error("el destino de la restauración es la base de producción");
            }
          } catch (error) {
            console.log("ERROR: " + error.message + ". No se restaura nada.");
            process.exit(1);
          }
          console.log("Destino de la restauración: OK");
          GUARD

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$GDRIVE_RCLONE_CONFIG" || (echo "GDRIVE_RCLONE_CONFIG secret is missing" && exit 1)
          test -n "$GDRIVE_FOLDER_ID" || (echo "GDRIVE_FOLDER_ID secret is missing" && exit 1)
          test -n "$RESTORE_TEST_DATABASE_URL" || (echo "RESTORE_TEST_DATABASE_URL secret is missing" && exit 1)

      - name: Install rclone
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Google Drive access
        shell: bash
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$GDRIVE_RCLONE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
          if grep -q '^root_folder_id[[:space:]]*=' "$HOME/.config/rclone/rclone.conf"; then
            sed -i "s|^root_folder_id[[:space:]]*=.*|root_folder_id = $GDRIVE_FOLDER_ID|" "$HOME/.config/rclone/rclone.conf"
          else
            printf '\nroot_folder_id = %s\n' "$GDRIVE_FOLDER_ID" >> "$HOME/.config/rclone/rclone.conf"
          fi
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Download latest backup
        shell: bash
        run: |
          latest_enc="$(rclone lsf gdrive: --include 'agrovet-postgres-*.dump.enc' | sort | tail -n 1)"
          if [ -n "$latest_enc" ]; then
            echo "Using encrypted backup: $latest_enc"
            test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || (echo "Backup cifrado encontrado pero falta BACKUP_ENCRYPTION_PASSPHRASE" && exit 1)
            rclone copyto "gdrive:$latest_enc" "$RUNNER_TEMP/$latest_enc"
            decrypted="${latest_enc%.enc}"
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in "$RUNNER_TEMP/$latest_enc" \
              -out "$RUNNER_TEMP/$decrypted" \
              -pass env:BACKUP_ENCRYPTION_PASSPHRASE
            echo "BACKUP_FILE=$decrypted" >> "$GITHUB_ENV"
            echo "BACKUP_PATH=$RUNNER_TEMP/$decrypted" >> "$GITHUB_ENV"
          else
            latest_backup="$(rclone lsf gdrive: --include 'agrovet-postgres-*.dump' | sort | tail -n 1)"
            test -n "$latest_backup" || (echo "No backup files found in Google Drive" && exit 1)
            echo "Using backup: $latest_backup"
            rclone copyto "gdrive:$latest_backup" "$RUNNER_TEMP/$latest_backup"
            echo "BACKUP_FILE=$latest_backup" >> "$GITHUB_ENV"
            echo "BACKUP_PATH=$RUNNER_TEMP/$latest_backup" >> "$GITHUB_ENV"
          fi

      - name: Restore backup into test database
        shell: bash
        run: |
          # La salida no va al log público: un error de pg_restore puede citar filas con datos de clientes.
          docker run --rm \
            -e RESTORE_TEST_DATABASE_URL \
            -e BACKUP_FILE \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine \
            sh -c 'pg_restore --clean --if-exists --no-owner --no-acl --dbname="$RESTORE_TEST_DATABASE_URL" "/backup/$BACKUP_FILE"' > /dev/null 2>&1 || {
              echo "Restauración: ERROR"
              exit 1
            }
          echo "Restauración: OK"

      - name: Verify restored data
        shell: bash
        run: |
          # Solo OK o error: las cantidades de pedidos no se publican en un log público.
          docker run --rm -i \
            -e RESTORE_TEST_DATABASE_URL \
            postgres:17-alpine \
            sh -c 'psql "$RESTORE_TEST_DATABASE_URL" -q -v ON_ERROR_STOP=1' > /dev/null 2>&1 <<'SQL' || {
          DO $$
          DECLARE
            tabla TEXT;
          BEGIN
            FOREACH tabla IN ARRAY ARRAY['products', 'variants', 'orders', 'order_items', 'inventory', 'wholesale_clients'] LOOP
              IF to_regclass('public.' || tabla) IS NULL THEN
                RAISE EXCEPTION 'falta una tabla';
              END IF;
            END LOOP;
            PERFORM 1 FROM public.products LIMIT 1;
            IF NOT FOUND THEN
              RAISE EXCEPTION 'no hay productos';
            END IF;
          END
          $$;
          SQL
            echo "Verificación: ERROR"
            exit 1
          }
          echo "Verificación: OK"
